    <!-- Schema.org FAQPage Structured Data (JSON-LD) for Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What information do I need to order a report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You only need the vehicle’s 17-character Vehicle Identification Number (VIN) or the license plate / registration number along with the province or state. For delivery, provide your name and email address where the report should be sent."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to receive my report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Orders are processed upon payment confirmation. Sample reports can be viewed instantly, and compiled PDF reports are dispatched to your email and WhatsApp according to operational availability."
          }
        },
        {
          "@type": "Question",
          "name": "How will I receive my report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your finished report is delivered to your registered email address as a PDF document. You can also view and download it directly from your AutoAudit customer dashboard."
          }
        },
        {
          "@type": "Question",
          "name": "Can I access previous reports?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Once an order is completed, your report remains accessible in your customer dashboard under \"My Reports\" using your order number and email, where it can be viewed or printed."
          }
        },
        {
          "@type": "Question",
          "name": "What information is included in a vehicle report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A report summarizes vehicle history information such as title status, odometer readings and reported incidents, where available. Coverage can vary by vehicle, and reports may be incomplete. See the sample report for the layout."
          }
        },
        {
          "@type": "Question",
          "name": "What is your refund/cancellation policy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Please contact support about cancellations or refunds. Refund terms are confirmed with your order."
          }
        },
        {
          "@type": "Question",
          "name": "How do I print or export my vehicle report as a PDF?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can save or print your report as a PDF using your browser’s print menu. Select \"Save as PDF\" as the destination and ensure background graphics are enabled for badges and formatting. On mobile devices, use the Share or browser menu to export directly to PDF."
          }
        }
      ]
    }
    </script>
