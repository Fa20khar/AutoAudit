            "@type": "Answer",

          "@type": "Question",
          "name": "How quickly will I receive my vehicle report after ordering?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "Are AutoAudit reports backed by official government databases?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. AutoAudit aggregates data from the National Motor Vehicle Title Information System (NMVTIS), state DMVs, authorized salvage auctions, and law enforcement theft registries."
          }
        },
        {
          "@type": "Question",
          "name": "Where can I find the 17-digit VIN number on a vehicle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The 17-digit VIN is typically visible on the driver's side dashboard through the windshield, on the driver's door jamb sticker, or on the vehicle registration card and insurance policy documents."
          }
        }
      ]
    }
